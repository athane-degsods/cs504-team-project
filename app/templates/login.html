{% block title %}Login{% endblock %}

{% block page_content %}
    <h1>Login</h1>
    <form method="POST">
        {{ form.hidden_tag() }}
        {{ form.username.label }} {{ form.username() }}
        {{ form.password.label }} {{ form.password() }}
        {{ form.pin.label }} {{ form.pin() }}
        {{ form.submit() }}
    </form>
{% endblock %}
