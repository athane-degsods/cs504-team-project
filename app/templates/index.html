{% extends "base.html" %}

{% block title %}Flasky - Home{% endblock %}

{% block page_content %}
    <div class="form">
        <div class="page-header">
            <h1>Welcome back</h1>
            <p>Hello, <strong>{{ current_user.username }}</strong>!</p>
        </div>

        <div class="form-group">
            <p>You are signed in and ready to continue.</p>
        </div>

        <div class="submit-container">
            <a class="button" href="{{ url_for('main.logout') }}">Log Out</a>
        </div>
    </div>
{% endblock %}
