<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Page</title>
</head>
<body>
    <h1>Register</h1>
    <form id="register-form">
        <div>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
        </div>

        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
        </div>

        <div>
            <label for="confirm-password">Confirm Password:</label>
            <input type="password" id="confirm-password" name="confirm-password" required>
        </div>

        <div>
            <label for="PIN">PIN:</label>
            <input type="password" id="PIN" name="PIN" required>
        </div>

        <div>
            If you already have an account, please <a href="/login" id="login-link">login here</a>.
        </div>

        <button type="submit">Register</button>
    </form>
</body>
    <div id="log"></div>
</html>

<script>
    const form = document.getElementById('register-form');
    const log = document.getElementById('log');

    async function submitForm( username, password, PIN) {
        const url = 'http://127.0.0.1:5000/register';

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, password, PIN })   
            })

            const result = await response.json();
            console.log('Result: ', result);

            if (!response.ok) {
                return result;
            }

            return result;
        } catch (error) {
            console.error('Error message: ', error.message);
        }
    }

    form.addEventListener('submit', async function(event) {
        event.preventDefault();

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const PIN = document.getElementById('PIN').value;
        
        const submission = await submitForm(username, password, PIN);
        
        console.log('[frontend] Submitting form: ', username, password, PIN);
        
        log.textContent = 'Submitting form: ' + username + ', ' + password + ', ' + PIN;
        log.textContent += '\n';
        log.textContent += 'Submission result: ' + JSON.stringify(submission);   
    });

</script>
