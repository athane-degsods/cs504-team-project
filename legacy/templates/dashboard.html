<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
</head>
<body>
    <div id="login-section">
        <h1>Dashboard</h1>
        <label>You can only access this after providing a valid credential.</label>
    </div>

    <div id='log'>

    </div>
</body>
</html>

<script>
    const log = document.getElementById('log');

    // fetch the current_user, iat, nbf, and exp
    async function fetchDashboardData() {
        const url = 'http://127.0.0.1:5000/state';

        try {
            const response = await fetch(url, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    'Cookie': document.cookie
                }
            });

            const result = await response.json();
            console.log(result);

            if (!response.ok) {
                return result;
            }

            return result;
        } catch (error) {
            console.error('Error fetching dashboard data:', error);
        }
    }

    
    async function initDashboard() {
        const state = await fetchDashboardData();
        console.log('Result: ', state);
        log.textContent = JSON.stringify(state, null, 2);
    }

    initDashboard();

</script>
